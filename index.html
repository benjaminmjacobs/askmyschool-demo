<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>AskMySchool</title>
  <meta name="description" content="Trusted school information. Instant answers." />

  <meta name="theme-color" content="#0A6D80" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="AskMySchool" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon-1024.png" />
  <link rel="apple-touch-icon" href="/icon-1024.png" />

  <style>
    :root {
      --teal: #0A6D80;
      --aqua: #6DBBB7;
      --yellow: #F4C23E;
      --coral: #F26B5B;
      --evergreen: #134D45;
      --cream: #FFF6E6;
      --charcoal: #2B2F32;
      --white: #ffffff;
      --border: rgba(19, 77, 69, 0.14);
      --shadow: 0 18px 55px rgba(19, 77, 69, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(244, 194, 62, 0.28), transparent 36%),
        radial-gradient(circle at bottom right, rgba(109, 187, 183, 0.30), transparent 38%),
        var(--cream);
      color: var(--charcoal);
    }

    .page {
      min-height: 100vh;
      padding: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 540px;
      min-height: min(860px, calc(100vh - 44px));
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--border);
      border-radius: 34px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      padding: 22px 22px 18px;
      background:
        linear-gradient(135deg, rgba(10, 109, 128, 0.10), rgba(244, 194, 62, 0.18)),
        var(--white);
      border-bottom: 1px solid var(--border);
    }

    .brand-row {
      display: flex;
      align-items: center;
    }

    .brand-logo {
      width: 230px;
      max-width: 100%;
      height: auto;
      display: block;
    }

    .brand-text p {
      margin: 4px 0 0;
      font-size: 13px;
      color: rgba(43, 47, 50, 0.68);
    }

    .district-pill {
      margin-top: 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(10, 109, 128, 0.10);
      color: var(--evergreen);
      font-size: 13px;
      font-weight: 800;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: #2FA66A;
      box-shadow: 0 0 0 4px rgba(47, 166, 106, 0.12);
    }

    .school-selector {
      margin-top: 14px;
      position: relative;
    }

    .school-selector-button {
      width: 100%;
      border: 1px solid rgba(10, 109, 128, 0.16);
      background: rgba(255, 255, 255, 0.82);
      border-radius: 18px;
      padding: 13px 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .school-selector-button:hover {
      box-shadow: 0 8px 20px rgba(10, 109, 128, 0.10);
      transform: translateY(-1px);
    }

    .school-selector-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 3px;
    }

    .school-selector-title {
      font-size: 13px;
      font-weight: 900;
      color: var(--evergreen);
    }

    .school-selector-subtitle {
      font-size: 11px;
      color: rgba(43, 47, 50, 0.58);
      font-weight: 700;
    }

    .school-selector-arrow {
      color: var(--evergreen);
      font-size: 14px;
      font-weight: 900;
    }

    .school-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      background: white;
      border: 1px solid rgba(10, 109, 128, 0.12);
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(19, 77, 69, 0.16);
      padding: 10px;
      display: none;
      z-index: 50;
    }

    .school-dropdown.open {
      display: block;
    }

    .school-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .school-option:hover {
      background: rgba(10, 109, 128, 0.06);
    }

    .school-option input {
      width: 18px;
      height: 18px;
      accent-color: var(--teal);
      cursor: pointer;
    }

    .school-option-label {
      font-size: 14px;
      font-weight: 750;
      color: var(--charcoal);
    }

    .quick-prompts {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 14px 18px;
      background: rgba(255, 246, 230, 0.48);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }

    .quick-prompts::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      border: 1px solid rgba(10, 109, 128, 0.18);
      background: var(--white);
      color: var(--evergreen);
      border-radius: 999px;
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .chip:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(10, 109, 128, 0.12);
    }

    .messages {
      flex: 1;
      padding: 20px 18px;
      overflow-y: auto;
      background:
        linear-gradient(180deg, rgba(255, 246, 230, 0.58), rgba(255, 255, 255, 0.9));
    }

    .welcome-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(19, 77, 69, 0.08);
      margin-bottom: 16px;
    }

    .welcome-card h2 {
      margin: 0 0 8px;
      color: var(--evergreen);
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .welcome-card p {
      margin: 0;
      color: rgba(43, 47, 50, 0.72);
      font-size: 14px;
      line-height: 1.45;
    }

    .message-row {
      display: flex;
      gap: 10px;
      margin: 14px 0;
      align-items: flex-end;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: var(--cream);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar img {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .user-avatar {
      background: var(--coral);
      color: white;
      font-weight: 900;
      font-size: 13px;
    }

    .bubble {
      max-width: 82%;
      padding: 13px 15px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bot .bubble {
      background: var(--white);
      color: var(--charcoal);
      border: 1px solid var(--border);
      border-bottom-left-radius: 7px;
      box-shadow: 0 8px 22px rgba(19, 77, 69, 0.08);
    }

    .user .bubble {
      background: var(--teal);
      color: white;
      border-bottom-right-radius: 7px;
    }

    .bubble strong {
      color: var(--evergreen);
    }

    .notice {
      border-left: 5px solid var(--coral) !important;
      background: #fff7f2 !important;
      padding: 12px 14px !important;
    }

    .notice-title {
      font-weight: 900;
      color: var(--evergreen);
      margin-bottom: 5px;
      line-height: 1.25;
    }

    .notice-message {
      line-height: 1.35;
    }

    .notice-meta {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(43, 47, 50, 0.62);
      font-weight: 700;
      line-height: 1.25;
    }

    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      height: 20px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--aqua);
      animation: bounce 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.16s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.32s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      40% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    .composer {
      padding: 16px;
      background: var(--white);
      border-top: 1px solid var(--border);
    }

    .input-wrap {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: #fafafa;
      border: 1px solid rgba(43, 47, 50, 0.14);
      border-radius: 22px;
      padding: 10px;
    }

    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 140px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--charcoal);
      font: inherit;
      font-size: 15px;
      line-height: 1.35;
      padding: 5px 4px;
    }

    textarea::placeholder {
      color: rgba(43, 47, 50, 0.45);
    }

    button.send {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 17px;
      background: var(--coral);
      color: white;
      font-weight: 900;
      font-size: 19px;
      cursor: pointer;
      flex: 0 0 auto;
      box-shadow: 0 8px 20px rgba(242, 107, 91, 0.28);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button.send:hover {
      transform: translateY(-1px);
    }

    button.send:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .fine-print {
      text-align: center;
      margin-top: 10px;
      font-size: 11px;
      color: rgba(43, 47, 50, 0.48);
    }

    @media (max-width: 560px) {
      .page {
        padding: 0;
        align-items: stretch;
      }

      .app-shell {
        min-height: 100vh;
        max-width: none;
        border-radius: 0;
        border: 0;
      }

      .app-header {
        padding-top: max(18px, env(safe-area-inset-top));
      }

      .brand-logo {
        width: 205px;
      }

      .bubble {
        max-width: 86%;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="app-shell">
      <header class="app-header">
        <div class="brand-row">
          <div class="brand-text">
            <img class="brand-logo" src="/logo_horizontal.png" alt="AskMySchool" />
            <p>Trusted school information. Instant answers.</p>
          </div>
        </div>

        <div class="district-pill">
          <span class="status-dot"></span>
          Ben Hill County Schools Demo
        </div>

        <div class="school-selector">
          <button class="school-selector-button" onclick="toggleSchoolDropdown()">
            <div class="school-selector-left">
              <div class="school-selector-title">Follow school alerts</div>
              <div class="school-selector-subtitle" id="schoolSelectorSummary">
                Select schools
              </div>
            </div>

            <div class="school-selector-arrow">▼</div>
          </button>

          <div class="school-dropdown" id="schoolDropdown">
            <label class="school-option">
              <input type="checkbox" value="ben_hill_primary" onchange="handleSchoolSelection()" />
              <span class="school-option-label">Ben Hill Primary School</span>
            </label>

            <label class="school-option">
              <input type="checkbox" value="ben_hill_elementary" onchange="handleSchoolSelection()" />
              <span class="school-option-label">Ben Hill Elementary School</span>
            </label>

            <label class="school-option">
              <input type="checkbox" value="ben_hill_middle" onchange="handleSchoolSelection()" />
              <span class="school-option-label">Ben Hill Middle School</span>
            </label>

            <label class="school-option">
              <input type="checkbox" value="fitzgerald_high" onchange="handleSchoolSelection()" />
              <span class="school-option-label">Fitzgerald High School</span>
            </label>

            <label class="school-option">
              <input type="checkbox" value="ben_hill_prek" onchange="handleSchoolSelection()" />
              <span class="school-option-label">Ben Hill Pre-K</span>
            </label>
          </div>
        </div>
      </header>

      <div class="quick-prompts">
        <button class="chip" onclick="usePrompt('What is for lunch tomorrow at the primary school?')">
          Lunch tomorrow
        </button>

        <button class="chip" onclick="usePrompt('Is there school tomorrow?')">
          School tomorrow?
        </button>

        <button class="chip" onclick="usePrompt('When is graduation this year?')">
          Graduation
        </button>

        <button class="chip" onclick="usePrompt('What time does school start?')">
          Start times
        </button>
      </div>

      <section id="messages" class="messages">
        <div class="welcome-card">
          <h2>What do you need to know?</h2>
          <p>
            Ask about menus, calendars, school events, closures, policies, or district information.
          </p>
        </div>
      </section>

      <footer class="composer">
        <div class="input-wrap">
          <textarea
            id="input"
            placeholder="Ask a school question..."
            rows="1"
          ></textarea>

          <button id="sendButton" class="send" onclick="sendMessage()">
            ➤
          </button>
        </div>

        <div class="fine-print">
          Answers are based on available district documents and active updates.
        </div>
      </footer>
    </section>
  </main>

  <script>
    let askMySchoolSessionId = null;
    let askMySchoolUserId = "demo-user";

    const SCHOOL_STORAGE_KEY = "askmyschool_selected_schools";
    const displayedNoticeIds = [];

    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const button = document.getElementById("sendButton");

    function getSelectedSchoolIds() {
      try {
        const stored = localStorage.getItem(SCHOOL_STORAGE_KEY);

        if (!stored) {
          return [];
        }

        const parsed = JSON.parse(stored);

        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveSelectedSchoolIds(selectedSchoolIds) {
      localStorage.setItem(
        SCHOOL_STORAGE_KEY,
        JSON.stringify(selectedSchoolIds)
      );
    }

    function updateSchoolSummary() {
      const selected = getSelectedSchoolIds();
      const summary = document.getElementById("schoolSelectorSummary");

      if (selected.length === 0) {
        summary.textContent = "Select schools for school-specific alerts";
        return;
      }

      if (selected.length === 1) {
        summary.textContent = getSchoolDisplayName(selected[0]);
        return;
      }

      summary.textContent = `${selected.length} schools selected`;
    }

    function getSchoolDisplayName(schoolId) {
      const labels = {
        ben_hill_primary: "Ben Hill Primary School",
        ben_hill_elementary: "Ben Hill Elementary School",
        ben_hill_middle: "Ben Hill Middle School",
        fitzgerald_high: "Fitzgerald High School",
        ben_hill_prek: "Ben Hill Pre-K",
        districtwide: "Districtwide"
      };

      return labels[schoolId] || schoolId;
    }

    function toggleSchoolDropdown() {
      const dropdown = document.getElementById("schoolDropdown");
      dropdown.classList.toggle("open");
    }

    function handleSchoolSelection() {
      const checked = Array.from(
        document.querySelectorAll(".school-dropdown input:checked")
      ).map((input) => input.value);

      saveSelectedSchoolIds(checked);
      updateSchoolSummary();
    }

    function hydrateSchoolSelections() {
      const selected = getSelectedSchoolIds();

      document.querySelectorAll(".school-dropdown input").forEach((input) => {
        input.checked = selected.includes(input.value);
      });

      updateSchoolSummary();
    }

    document.addEventListener("click", function(event) {
      const dropdown = document.getElementById("schoolDropdown");
      const selector = document.querySelector(".school-selector");

      if (!selector.contains(event.target)) {
        dropdown.classList.remove("open");
      }
    });

    function usePrompt(text) {
      input.value = text;
      input.focus();
      autoResizeInput();
    }

    function addUserMessage(text) {
      const row = document.createElement("div");
      row.className = "message-row user";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      const avatar = document.createElement("div");
      avatar.className = "avatar user-avatar";
      avatar.textContent = "You";

      row.appendChild(bubble);
      row.appendChild(avatar);

      messages.appendChild(row);

      scrollMessages();
    }

    function addBotMessage(text, options = {}) {
      const row = document.createElement("div");
      row.className = "message-row bot";

      const avatar = document.createElement("div");
      avatar.className = "avatar";

      const avatarImg = document.createElement("img");
      avatarImg.src = "/icon-transparent.png";
      avatarImg.alt = "AskMySchool";

      avatar.appendChild(avatarImg);

      const bubble = document.createElement("div");
      bubble.className = options.notice ? "bubble notice" : "bubble";
      bubble.innerHTML = options.html ? text : formatAnswer(text);

      row.appendChild(avatar);
      row.appendChild(bubble);

      messages.appendChild(row);

      scrollMessages();

      return bubble;
    }

    function addTypingMessage() {
      const row = document.createElement("div");
      row.className = "message-row bot";

      const avatar = document.createElement("div");
      avatar.className = "avatar";

      const avatarImg = document.createElement("img");
      avatarImg.src = "/icon-transparent.png";
      avatarImg.alt = "AskMySchool";

      avatar.appendChild(avatarImg);

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      bubble.innerHTML =
        '<div class="typing"><span></span><span></span><span></span></div>';

      row.appendChild(avatar);
      row.appendChild(bubble);

      messages.appendChild(row);

      scrollMessages();

      return row;
    }

    function getNoticeIdentity(update) {
      return [
        update.update_id || "",
        update.school_id || "",
        update.title || "",
        update.message || "",
        update.active_until || ""
      ].join("|");
    }

    function displayEmergencyUpdates(updates) {
      if (!Array.isArray(updates) || updates.length === 0) {
        return [];
      }

      const displayedNow = [];

      updates.forEach((update) => {
        const noticeId = getNoticeIdentity(update);

        if (displayedNoticeIds.includes(noticeId)) {
          return;
        }

        const schoolScope =
          update.school_scope ||
          getSchoolDisplayName(update.school_id) ||
          "Districtwide";

        const title =
          update.title ||
          "School Notice";

        const message =
          update.message ||
          "There is an active school notice.";

        const noticeHtml = `
          <div class="notice-title">Update Notice: ${escapeHtml(title)}</div>
          <div class="notice-message">${escapeHtml(message)}</div>
          <div class="notice-meta">${escapeHtml(schoolScope)}</div>
        `;

        addBotMessage(noticeHtml, {
          notice: true,
          html: true
        });

        displayedNoticeIds.push(noticeId);
        displayedNow.push(update);
      });

      return displayedNow;
    }

    function normalizeForComparison(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^\w\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function removeDuplicateNoticeText(answer, updatesShownNow) {
      if (!Array.isArray(updatesShownNow) || updatesShownNow.length === 0) {
        return answer;
      }

      let cleanedAnswer = String(answer || "");

      updatesShownNow.forEach((update) => {
        const noticeMessage = String(update.message || "").trim();

        if (!noticeMessage) {
          return;
        }

        const normalizedNotice = normalizeForComparison(noticeMessage);

        const paragraphs = cleanedAnswer
          .split(/\n\s*\n/)
          .filter((paragraph) => {
            const normalizedParagraph = normalizeForComparison(paragraph);

            if (!normalizedParagraph) {
              return false;
            }

            if (normalizedParagraph.includes(normalizedNotice)) {
              return false;
            }

            return true;
          });

        cleanedAnswer = paragraphs.join("\n\n");
      });

      return cleanedAnswer.trim();
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      const selectedSchoolIds = getSelectedSchoolIds();

      addUserMessage(text);

      input.value = "";

      autoResizeInput();

      button.disabled = true;

      const typingRow = addTypingMessage();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: text,
            sessionId: askMySchoolSessionId,
            userId: askMySchoolUserId,
            schoolId: selectedSchoolIds[0] || "districtwide",
            selectedSchoolIds,
            channel: "web"
          })
        });

        const data = await res.json();

        if (data.sessionId) {
          askMySchoolSessionId = data.sessionId;
        }

        if (data.userId) {
          askMySchoolUserId = data.userId;
        }

        const answer =
          data.text ||
          data.output?.text ||
          data.response?.text ||
          JSON.stringify(data, null, 2);

        typingRow.remove();

        const updatesShownNow = displayEmergencyUpdates(
          data.emergency?.updates || []
        );

        const cleanedAnswer = removeDuplicateNoticeText(
          answer,
          updatesShownNow
        );

        if (cleanedAnswer) {
          const answerAlreadyLooksLikeNotice =
            String(cleanedAnswer).toLowerCase().includes("update notice:");

          addBotMessage(cleanedAnswer, {
            notice: answerAlreadyLooksLikeNotice
          });
        }

      } catch (error) {
        typingRow.remove();

        addBotMessage(
          "Sorry, something went wrong. Please try again."
        );

        console.error(
          "AskMySchool UI error:",
          error
        );
      } finally {
        button.disabled = false;
        input.focus();
        scrollMessages();
      }
    }

    function formatAnswer(value) {
      let text = escapeHtml(value);

      text = text.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      );

      text = text.replace(
        /Update Notice:/g,
        "<strong>Update Notice:</strong>"
      );

      text = text.replace(/\n/g, "<br>");

      return text;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function scrollMessages() {
      messages.scrollTop = messages.scrollHeight;
    }

    function autoResizeInput() {
      input.style.height = "auto";
      input.style.height =
        Math.min(input.scrollHeight, 140) + "px";
    }

    input.addEventListener("input", autoResizeInput);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    hydrateSchoolSelections();
  </script>
</body>
</html>
