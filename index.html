<!DOCTYPE html>
<html>
<head>
  <title>AskMySchool Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: Arial, sans-serif; background:#f4f1ea; color:#1f3527; margin:0; padding:24px; }
    .wrap { max-width:800px; margin:0 auto; }
    .chat { background:white; border-radius:16px; padding:20px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
    #messages { min-height:360px; border:1px solid #ddd; padding:16px; border-radius:12px; background:#fafafa; overflow:auto; }
    .msg { margin:10px 0; line-height:1.5; }
    .user { font-weight:bold; color:#2f5d46; }
    .bot { color:#333; }
    textarea { width:100%; height:80px; margin-top:14px; padding:12px; border-radius:10px; border:1px solid #ccc; font-size:16px; box-sizing:border-box; }
    button { margin-top:10px; padding:12px 20px; background:#2f5d46; color:white; border:0; border-radius:10px; font-weight:bold; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AskMySchool Demo</h1>
    <p>Stress test demo for school information questions.</p>

    <div class="chat">
      <div id="messages">
        <div class="msg bot">Ask a school question to begin.</div>
      </div>

      <textarea id="input" placeholder="Example: What's for lunch at the primary school?"></textarea>
      <button id="sendButton" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let askMySchoolSessionId = null;
    let askMySchoolUserId = "demo-user";

    async function sendMessage() {
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");
      const button = document.getElementById("sendButton");

      const text = input.value.trim();
      if (!text) return;

      messages.innerHTML += `<div class="msg user">You: ${escapeHtml(text)}</div>`;
      input.value = "";
      button.disabled = true;

      const thinkingId = `thinking-${Date.now()}`;
      messages.innerHTML += `<div id="${thinkingId}" class="msg bot">AskMySchool is thinking...</div>`;
      messages.scrollTop = messages.scrollHeight;

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: text,
            sessionId: askMySchoolSessionId,
            userId: askMySchoolUserId
          })
        });

        const data = await res.json();

        if (data.sessionId) {
          askMySchoolSessionId = data.sessionId;
        }

        if (data.userId) {
          askMySchoolUserId = data.userId;
        }

        const answer =
          data.text ||
          data.output?.text ||
          data.response?.text ||
          JSON.stringify(data, null, 2);

        const thinking = document.getElementById(thinkingId);
        if (thinking) {
          thinking.innerHTML = `<strong>AskMySchool:</strong> ${escapeHtml(answer)}`;
        }
      } catch (e) {
        const thinking = document.getElementById(thinkingId);
        if (thinking) {
          thinking.textContent = `Error: ${e.message}`;
        }
      } finally {
        button.disabled = false;
        input.focus();
        messages.scrollTop = messages.scrollHeight;
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("input").addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
